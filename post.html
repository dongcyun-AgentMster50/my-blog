<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>my blog</title>
    <!-- 순서 중요: 스타일시트보다 먼저 실행되어야 테마 깜빡임(FOUC)이 없다. -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("theme");
        } catch (e) {}
        var dark =
          saved === "dark" ||
          (saved === null &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/post.css" />
    <link id="hljs-theme" rel="stylesheet" href="vendor/highlightjs/styles/github.min.css" />
  </head>
  <body>
    <div class="container">
      <header class="site-header">
        <a class="site-title" href="index.html">my blog</a>
        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="테마 전환"
        ></button>
      </header>

      <main id="app">
        <p class="state-message">글을 불러오는 중…</p>
      </main>

      <footer class="site-footer">마크다운으로 쓰는 블로그</footer>
    </div>

    <script src="vendor/marked/marked.min.js"></script>
    <script src="vendor/highlightjs/highlight.min.js"></script>
    <script type="module" src="js/post.js"></script>
  </body>
</html>
