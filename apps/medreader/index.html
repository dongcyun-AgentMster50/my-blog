<!DOCTYPE html>
<!--
  ============================================================
  MedReader — 단일 진입점 (spec 2-1 · 12-1)

  ★ `file://` 로 열면 동작하지 않는다. 의도된 제약이다(spec 18 · 20절).
    이 앱은 ES modules 로 되어 있고 `file://` 에서는 브라우저가 모듈
    import 를 CORS 로 막는다. IndexedDB 도 origin 이 없어 쓸 수 없다.
    반드시 http:// 또는 https:// 로 열어라. 개발 중에는 레포 루트에서

        python -m http.server 8000
        → http://localhost:8000/apps/medreader/index.html

    빈 서재 화면에 같은 안내가 사용자 언어로 뜬다(20절).

  ★ 모든 화면이 이 한 파일 안에 `<section data-screen>` 으로 있다(12-1).
    라우터가 `hidden` 을 토글할 뿐 페이지 이동은 없다.

  ★ 문자열을 여기에 하드코딩하지 않는다. 전부 `data-i18n` / `data-i18n-aria`
    를 거쳐 `js/i18n/` 에서 온다. 예외는 둘이다 — i18n 이 돌 수 없는 자리다.
    · `<noscript>` — JS 가 꺼져 있으면 폴백 언어(en)로 한 줄.
    · 부팅 실패 안내(`#bootFail`) — 모듈이 못 뜨면 i18n 도 없다. 네 언어를 함께 적는다.

  ★ 배포 단위는 이 파일 한 장이다(배포 안전장치, 2026-10-12).
    `stamp-importmap` 구간의 import map 이 **모든 앱 모듈**을 내용 해시 URL
    (`./js/db.js?v=…`)로 돌리고 CSS 에도 같은 해시를 붙인다. 그래서 이 파일 하나가
    어느 판의 모듈·CSS 를 쓸지 정한다 — 옛 모듈과 새 모듈이 섞이지 않는다.
    진입점도 `src=` 가 아니라 **specifier**(`import './js/main.js'`)로 부른다
    (`src` 는 import map 을 거치지 않는다).
    ▶ JS·CSS 를 고쳤으면 커밋 전에 `node apps/medreader/dev/stamp-importmap.mjs`.
      잊으면 `tests/importmap.test.mjs` 가 빨갛게 된다.
  ============================================================
-->

<!-- ════ 부팅 실패 안내 (배포 안전장치) ═══════════════════
     모듈이 못 뜨면 화면은 배경색뿐이다(review.md PR-6 — 모든 화면이 `hidden` 이고 글자는 JS 가 채운다).
     그때를 위한 **정적** 안내다. 기본 숨김이고, 아래 고전 스크립트만 연다 — 모듈 시스템에 기대지 않는다.
     UI 언어 설정은 IndexedDB 에 있어 아직 못 읽을 수 있다 → 네 언어를 함께, 아랍어 먼저, 각자 `dir`. -->
<div class="boot-fail" id="bootFail" role="alert" hidden>
  <div class="boot-fail-box">
    <p lang="ar" dir="rtl">تعذّر تحميل التطبيق. يُرجى فتحه مرة أخرى بعد قليل.</p>
    <p lang="en" dir="ltr">The app could not be loaded. Please open it again in a moment.</p>
    <p lang="fr" dir="ltr">Impossible de charger l’application. Veuillez la rouvrir dans un instant.</p>
    <p lang="ko" dir="ltr">앱을 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.</p>
    <button type="button" id="bootFailReload">
      <span lang="ar" dir="rtl">إعادة التحميل</span>
      <span lang="en" dir="ltr">Reload</span>
      <span lang="fr" dir="ltr">Recharger</span>
      <span lang="ko" dir="ltr">다시 불러오기</span>
    </button>
  </div>
</div>
<script>
/* 부팅 감시 — **고전 스크립트**다(모듈이 아니다). 모듈이 하나도 못 떠도 이것은 돈다.
   진입 모듈보다 앞에 있어 모듈의 오류 이벤트보다 먼저 듣는다.

   안내를 여는 경우 (부팅 완료 표시 `<html data-boot="ok">` 가 서기 전에만 — main.js 가 세운다)
   ① 모듈을 못 받았다(404·네트워크) → 진입 `<script>` 요소의 `error`(버블하지 않아 캡처로 듣는다)
   ② 모듈 연결·평가 오류(옛·새 판이 섞여 export 가 없다 등) → window 의 `error`, 파일이 이 앱 폴더
   ③ 부팅이 던졌다 → main.js 의 `medreader:bootfailed`
   ④ BOOT_TIMEOUT_MS 안에 부팅 완료가 없다 → 그때 연다.
   늦게라도 부팅 완료가 서면 ③ 말고는 다시 닫는다 `[Review 수정]`. 부팅 완료는 "모듈 그래프 전체가
   받히고 연결·평가됐다"는 증거다 — ①② 가 진짜 그래프 실패였다면 main.js 가 돌지 못해 완료가 설 수
   없다. 그런데도 완료가 섰다면 그 오류는 앱 밖 `<script>`(확장 프로그램이 넣은 것 등)나 부팅을 막지 않은
   처리기 예외였다 — 멀쩡한 앱을 전면 안내로 덮어 둘 이유가 없다. ①은 이 앱의 스크립트(인라인 진입점이나
   이 폴더의 파일)만 본다.

   BOOT_TIMEOUT_MS = 20초의 근거: 앱 모듈 51개·약 1MB(압축 전, gzip 약 1/4)를 느린 모바일망
   (실효 0.5Mbps 안팎 · 왕복 0.3초 · import 깊이 6단)에서 받으면 대략 5~10초다. 그 두 배를 둔다.
   너무 짧으면 느린 망에서 멀쩡한 부팅에 안내가 뜬다(깜빡임) — 금지다. 오류는 ①②③이 즉시 잡으므로
   이 시간은 "멈춘 채 아무 일도 없는" 경우만 맡는다(예: IndexedDB 열기가 다른 탭에 막힘). */
(function () {
  'use strict';
  var BOOT_TIMEOUT_MS = 20000;
  var root = document.documentElement;
  var box = document.getElementById('bootFail');
  var btn = document.getElementById('bootFailReload');
  // 이 앱 폴더의 URL(쿼리·해시·파일명 뗌). 다른 출처의 오류(확장 프로그램 등)로 안내를 열지 않는다.
  var base = location.href.replace(/[?#].*$/, '').replace(/[^\/]*$/, '');
  var openedBy = null;

  function booted() { return root.getAttribute('data-boot') === 'ok'; }
  function open(why) {
    if (!box || openedBy) return;
    openedBy = why;
    root.setAttribute('data-boot-fail', why);
    box.hidden = false;
  }
  function closeOnBoot() {
    if (!openedBy || openedBy === 'failed') return;
    openedBy = null;
    root.removeAttribute('data-boot-fail');
    box.hidden = true;
  }

  window.addEventListener('error', function (ev) {
    if (booted()) return;
    var t = ev.target;
    if (t && t !== window && t.nodeName === 'SCRIPT') {
      var s = t.src || '';
      if (!s || s.indexOf(base) === 0) open('load');
      return;
    }
    var f = (ev && ev.filename) || '';
    if (f && f.indexOf(base) === 0) open('error');
  }, true);
  document.addEventListener('medreader:bootfailed', function () { open('failed'); });
  document.addEventListener('medreader:booted', closeOnBoot);
  setTimeout(function () { if (!booted()) open('timeout'); }, BOOT_TIMEOUT_MS);
  if (btn) btn.addEventListener('click', function () { location.reload(); });
})();
</script>

        <button type="button" class="primary big" id="langNext" data-i18n="common.continue"></button>
      </div>
    </div>

    <!-- 2. 고지 2종 + 동의 -->

        <input type="checkbox" id="aiConsentCheck">
        <label for="aiConsentCheck" data-i18n="onboarding.consent.check"></label>
      </div>
      <p class="muted" id="aiConsentHint" hidden data-i18n="onboarding.consent.needCheck"></p>
      <button type="button" class="primary" data-action="consent-agree" data-i18n="settings.ai.consent.agree"></button>
    </div>

    <div class="card settings-card" id="settingsAi">
      <h2 data-i18n="settings.ai.title"></h2>

      <div class="field">
        <label for="aiProvider" data-i18n="settings.ai.provider"></label>
        <select id="aiProvider"></select>
      </div>

      <div class="field">
        <label for="aiKey" data-i18n="settings.ai.key"></label>
        <div class="key-row">
          <!-- 키는 LTR 문자열이다. 아랍어 UI 에서도 입력칸 안은 왼쪽→오른쪽. -->
          <input type="password" id="aiKey" dir="ltr" autocomplete="off" autocapitalize="off"
                 autocorrect="off" spellcheck="false" inputmode="text">
          <button type="button" id="aiKeyToggle" data-action="key-toggle" aria-pressed="false"
                  aria-controls="aiKey"></button>
          <button type="button" id="aiKeyPaste" data-action="key-paste" data-i18n="settings.ai.key.paste"></button>
        </div>
        <!-- 12-7 — 키 입력창 옆 상시 경고(아랍어 우선). `ui/notice.js` 의 `piiWarning()`. -->
        <div id="aiPiiHost"></div>
        <p class="warn-note" id="aiKeyFormat" role="status" hidden data-i18n="settings.ai.key.unfamiliar"></p>
        <p class="key-stored" id="aiKeyStored"></p>
        <div class="row">
          <button type="button" data-action="key-save" data-i18n="settings.ai.key.save"></button>
          <button type="button" class="danger" id="aiKeyClear" data-action="key-clear" data-i18n="settings.ai.key.clear" hidden></button>
        </div>
        <p class="muted" id="aiKeyMsg" role="status" aria-live="polite"></p>
      </div>

      <!-- 19절 7b ① — 실제 호출을 확인하는 두 버튼. -->
      <div class="row action-row">
        <button type="button" class="primary" id="aiVerifyBtn" data-action="verify" data-i18n="settings.ai.verify"></button>
        <button type="button" class="primary" id="aiTestBtn" data-action="test" data-i18n="settings.ai.test"></button>
      </div>

      <div class="ai-result" id="aiVerifyResult" role="status" aria-live="polite" hidden>
        <p class="ai-result-text" id="aiVerifyText"></p>
        <p class="muted ai-result-hint" id="aiVerifyHint" hidden></p>
        <p class="muted ai-result-meta" id="aiVerifyMeta"></p>
      </div>

      <div class="ai-result" id="aiTestResult" role="status" aria-live="polite" hidden>
        <p class="ai-result-text" id="aiTestText"></p>
        <p class="muted" data-i18n="settings.ai.test.sample"></p>
        <p class="ai-sample" id="aiTestSample" lang="en" dir="ltr"></p>
        <p class="ai-translation" id="aiTestOutput" hidden></p>
        <p class="muted ai-result-hint" id="aiTestHint" hidden></p>
        <p class="muted ai-result-meta" id="aiTestMeta"></p>
      </div>

      <div class="consent-row">
        <input type="checkbox" id="aiRemember">
        <label for="aiRemember" data-i18n="settings.ai.remember"></label>
      </div>
      <p class="warn-note" id="aiRememberWarn" hidden data-i18n="settings.ai.remember.warning"></p>

      <div class="field">
        <label for="aiModel" data-i18n="settings.ai.model"></label>
        <select id="aiModel"></select>
      </div>

      <div class="field">
        <label for="aiDailyCap" data-i18n="settings.ai.dailyCap"></label>
        <input type="number" id="aiDailyCap" inputmode="numeric" min="1" step="1">
        <p class="muted" data-i18n="settings.ai.dailyCap.help"></p>
      </div>

      <div class="consent-row">
        <input type="checkbox" id="aiOnDevice">
        <label for="aiOnDevice" data-i18n="settings.ai.onDevice"></label>
      </div>

      <!-- 캐시 용량·비우기 자리(12-7). 용량 표시·상한 집행은 8c 가 채운다. -->
      <div class="field">
        <span class="field-label" data-i18n="settings.ai.cache"></span>
        <p class="muted" id="aiCacheSummary"></p>
        <button type="button" data-action="cache-clear" data-i18n="settings.ai.cache.clear"></button>
      </div>
    </div>

    <div class="card settings-card" id="settingsReadalong">
      <h2 data-i18n="settings.readalong.title"></h2>
      <!-- 속도 팝오버의 같은 줄과 **같은 그리기 함수**. 빈 그릇만 둔다. -->
      <div class="typeset-row readalong-row" id="settingsReadalongRow" data-readalong-host></div>
      <p class="readalong-info" id="aiTargetLang"></p>
      <p class="readalong-info" id="aiVoiceStatus"></p>
      <button type="button" class="link" id="aiVoiceHowTo" data-action="voice-howto" aria-expanded="false"
              aria-controls="aiVoiceHowToBody" hidden data-i18n="settings.readalong.voice.howTo"></button>
      <p class="muted" id="aiVoiceHowToBody" hidden></p>
    </div>
  </section>

  <!-- ════ 사용량 — 자리표시자. 8단계. ══════════════════ -->
  <section class="screen" data-screen="usage" hidden>
    <div class="topbar">
      <button type="button" data-nav="#/library" data-i18n-aria="nav.back" data-i18n="nav.back"></button>
      <h1 class="title" data-i18n="usage.placeholder.title"></h1>
    </div>
    <div class="placeholder">
      <p data-i18n="usage.placeholder.body"></p>
    </div>
  </section>

  <!-- ════ 정보 (12-1) ══════════════════════════════════ -->
  <section class="screen" data-screen="about" hidden>
    <div class="topbar">
      <button type="button" data-nav="#/library" data-i18n-aria="nav.back" data-i18n="nav.back"></button>
      <h1 class="title" data-i18n="about.title"></h1>
    </div>
    <div class="card">
      <p data-i18n="about.body"></p>
      <p data-i18n="about.rights"></p>
      <!-- 11-2: 문자열 안에 HTML 을 넣지 않는다. {link} 자리에 앵커를 JS 가 꽂는다. -->
      <p id="aboutOpenSource"></p>
      <p class="muted" id="aboutVersion"></p>
    </div>
  </section>

</main>

<!-- 12-7 — 모든 화면 위에 고정. 숨길 수 없다. -->
<footer class="notice-bar" data-i18n="notice.educationOnly"></footer>

<!-- 진입점 — **`src=` 로 부르지 않는다.** `<script src>` 의 URL 은 import map 을 거치지 않아
     `js/main.js` 만 해시 없이(옛 판 캐시로) 받힐 수 있다. specifier 로 부르면 표를 탄다. -->
<script type="module">import './js/main.js';</script>
</body>
</html>
