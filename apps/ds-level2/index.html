  <meta name="description" content="데이터 사이언스 레벨2 시험 대비 학습앱 — 요약 카드, 필기 퀴즈, Jupyter 실습, 오답 노트, 복습, 모의고사, 용어 사전">
  <title>데이터 사이언스 레벨2 학습</title>
  <script>
    /* FOUC 방지: 스타일시트보다 먼저 테마·글자 크기·임베드 모드를 <html> 에 박는다.
       설정 키는 블로그의 "theme" 키와 섞이지 않는 자체 네임스페이스. localStorage 접근 자체가
       예외일 수 있어(샌드박스 iframe) 전부 try/catch. 로직은 app.js 의 applyTheme 와 같아야 한다. */
    (function () {
      var html = document.documentElement;
      var settings = {};
      try { settings = JSON.parse(localStorage.getItem('apps.ds-level2.settings.v1') || '{}') || {}; } catch (e) { settings = {}; }
      var q = {};
      try { location.search.slice(1).split('&').forEach(function (kv) { var p = kv.split('='); if (p[0]) q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || ''); }); } catch (e) { /* 무시 */ }
      var theme = (q.theme === 'light' || q.theme === 'dark') ? q.theme : settings.theme;
      if (theme !== 'light' && theme !== 'dark') {
        var dark = false;
        try { dark = window.matchMedia('(prefers-color-scheme: dark)').matches; } catch (e) { /* 무시 */ }
        theme = dark ? 'dark' : 'light';
      }
      html.setAttribute('data-theme', theme);
      if (settings.fontScale === 1.15) html.setAttribute('data-font', 'large');
      var embedded = q.embed === '1';
      try { embedded = embedded || window.self !== window.top; } catch (e) { embedded = true; }
      if (embedded) html.setAttribute('data-embed', '');
    })();
  </script>

</head>
