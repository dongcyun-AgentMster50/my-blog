<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>my blog</title>
    <!-- 순서 중요: 스타일시트보다 먼저 실행되어야 테마 깜빡임(FOUC)이 없다. -->
    <script>
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem("theme");
        } catch (e) {}
        var dark =
          saved === "dark" ||
          (saved === null &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <div class="container">
      <header class="site-header">
        <a class="site-title" href="index.html">my blog</a>
        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="테마 전환"
        ></button>
      </header>

      <!-- 앱 카드는 정적으로 둔다. 앱 추가는 Embed 단계에서만 일어나므로
           글처럼 manifest로 동적 로딩할 이유가 없다. -->
      <section class="apps-section" aria-labelledby="apps-heading">
        <h2 id="apps-heading" class="section-heading">앱</h2>
        <article class="app-card">
          <div class="app-card-info">
            <h3 class="app-card-title">
              <a href="apps/2048/index.html">2048</a>
            </h3>
            <p class="app-card-desc">
              방향키(모바일은 스와이프)로 숫자 타일을 밀어 합치는 퍼즐.
              점수판과 한 수 되돌리기를 지원합니다.
            </p>
            <a class="app-card-open" href="apps/2048/index.html">전체 화면으로 열기 →</a>
          </div>
          <iframe
            class="app-card-frame"
            src="apps/2048/index.html"
            title="2048 게임"
            loading="lazy"
          ></iframe>
        </article>
      </section>

      <section aria-labelledby="posts-heading">
        <h2 id="posts-heading" class="section-heading">글</h2>
        <main id="app">
          <p class="state-message">글을 불러오는 중…</p>
        </main>
      </section>

      <footer class="site-footer">마크다운으로 쓰는 블로그</footer>
    </div>

    <script type="module" src="js/home.js"></script>
  </body>
</html>
